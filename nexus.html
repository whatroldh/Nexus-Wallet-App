<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f19">
    <meta name="description" content="Nexus - نظام المحفظة والتحويل الذكي - Smart Wallet & Transfer System for Android">
    <title>Nexus - نظام المحفظة والتحويل الذكي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg: #0b0f19;
            --bg-card: #131b2e;
            --bg-soft: #1e293b;
            --text: #ffffff;
            --muted: #94a3b8;
            --primary: #38bdf8;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --green-box: #065f46;
            --green-border: #10b981;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        html {
            background: var(--bg);
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px 12px 30px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-section {
            background: linear-gradient(145deg, var(--bg-card), #0f172a);
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 8px 20px var(--shadow);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
            display: block;
            text-align: right;
        }

        .custom-input {
            width: 100%;
            background-color: var(--bg-soft);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--primary);
        }

        .balance-box {
            background: linear-gradient(135deg, var(--green-box), #047857);
            border: 1px solid var(--green-border);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-top: 10px;
        }

        .balance-label {
            font-size: 12px;
            color: #d1fae5;
            margin-bottom: 3px;
        }

        .balance-amount {
            font-size: 20px;
            font-weight: bold;
            color: var(--text);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text);
            text-align: center;
            transition: opacity 0.2s ease, transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-warning {
            background-color: var(--warning);
        }

        .btn-success {
            background-color: var(--success);
        }

        .btn-primary {
            background-color: #0284c7;
        }

        .btn-danger {
            background-color: var(--danger);
            grid-column: span 2;
        }

        .system-log {
            background-color: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: #4ade80;
            min-height: 60px;
            text-align: center;
            direction: rtl;
            word-wrap: break-word;
        }

        .security-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (max-width: 420px) {
            body {
                padding: 12px 10px 24px;
            }

            .card-section {
                padding: 14px 12px;
            }

            .card-title {
                font-size: 15px;
            }

            .balance-amount {
                font-size: 18px;
            }

            .btn {
                font-size: 13px;
                padding: 11px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-section">
            <div class="card-title">1. حساب السوبر كي الشخصي (بطاقتك)</div>
            <div class="input-group">
                <label class="input-label">رقم بطاقة SuperQi الخاصة بك</label>
                <input type="text" class="custom-input" id="myCard" value="QI-9988-7766-55" readonly>
            </div>
            <div class="balance-box">
                <div class="balance-label">الرصيد المتاح في المحفظة</div>
                <div class="balance-amount" id="currentBalance">5,000,000 د.ع</div>
            </div>
        </div>

        <div class="card-section">
            <div class="card-title">2. بيانات الطرف الثاني والمبلغ</div>
            <div class="input-group">
                <label class="input-label">حساب الشخص الآخر (المستلم / المرسل منه)</label>
                <input type="text" class="custom-input" id="otherCard" value="QI-1122-3344-55">
            </div>
            <div class="input-group">
                <label class="input-label">المبلغ (IQD)</label>
                <input type="text" class="custom-input" id="transferAmount" value="25,000">
            </div>
        </div>

        <div class="card-section">
            <div class="card-title">3. عمليات التحويل والتحقق الفوري</div>
            <div class="btn-grid">
                <button class="btn btn-warning" onclick="sendMoney()">إرسال مباشر للطرف الثاني</button>
                <button class="btn btn-success" onclick="requestMoney()">طلب استلام من الطرف الثاني</button>
            </div>
        </div>

        <div class="card-section">
            <div class="card-title">4. إدارة المحفظة (سحب وإيداع)</div>
            <div class="btn-grid">
                <button class="btn btn-primary" onclick="depositMoney()">إيداع رصيد<br>(Deposit)</button>
                <button class="btn btn-primary" onclick="withdrawMoney()">سحب رصيد<br>(Withdraw)</button>
            </div>
        </div>

        <div class="card-section">
            <div class="card-title">5. الأمان وإدارة الجلسة</div>
            <div class="security-section">
                <button class="btn btn-danger" onclick="resetSystem()">مسح البيانات بين الطرفين (Reset)</button>
                <div class="system-log" id="systemLog">
                    [System] : النظام جاهز، الرصيد الحالي 5,000,000 د.ع بانتظار العمليات...
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'nexus-wallet-state';
        const DEFAULT_BALANCE = 5000000;

        let balance = loadBalance();

        function loadBalance() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return DEFAULT_BALANCE;
                const parsed = JSON.parse(saved);
                return Number.isFinite(parsed?.balance) ? parsed.balance : DEFAULT_BALANCE;
            } catch (error) {
                return DEFAULT_BALANCE;
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                balance,
                updatedAt: new Date().toISOString(),
            }));
        }

        function updateBalanceDisplay() {
            const balanceElement = document.getElementById('currentBalance');
            if (balanceElement) {
                balanceElement.innerText = balance.toLocaleString('en-US') + ' د.ع';
            }
            saveState();
        }

        function setSystemLog(message) {
            const logElement = document.getElementById('systemLog');
            if (logElement) {
                logElement.innerText = message;
            }
        }

        function parseAmount(value) {
            if (value === null || value === undefined || value === '') {
                return NaN;
            }
            const cleaned = String(value).replace(/,/g, '').trim();
            const num = parseInt(cleaned, 10);
            return Number.isFinite(num) ? num : NaN;
        }

        function sendMoney() {
            const amount = prompt("أدخل المبلغ المراد إرساله:", "25000");
            if (amount === null) return;

            const num = parseAmount(amount);
            if (Number.isNaN(num) || num <= 0) {
                alert("الرجاء إدخال مبلغ صحيح!");
                return;
            }

            if (num > balance) {
                alert("عذراً، رصيدك غير كافٍ لإتمام عملية الإرسال!");
                return;
            }

            balance -= num;
            updateBalanceDisplay();
            setSystemLog('[System] : تم إرسال مبلغ ' + num.toLocaleString('en-US') + ' د.ع بنجاح إلى الطرف الثاني.');
        }

        function requestMoney() {
            const amount = prompt("أدخل المبلغ المطلوب استلامه:", "50000");
            if (amount === null) return;

            const num = parseAmount(amount);
            if (Number.isNaN(num) || num <= 0) {
                alert("الرجاء إدخال مبلغ صحيح!");
                return;
            }

            balance += num;
            updateBalanceDisplay();
            setSystemLog('[System] : تم استلام تحويل فوري بقيمة ' + num.toLocaleString('en-US') + ' د.ع من الطرف الثاني بنجاح وصار برصيدك!');
        }

        function depositMoney() {
            const amount = prompt("أدخل مبلغ الإيداع في المحفظة:", "100000");
            if (amount === null) return;

            const num = parseAmount(amount);
            if (Number.isNaN(num) || num <= 0) {
                alert("الرجاء إدخال مبلغ صحيح!");
                return;
            }

            balance += num;
            updateBalanceDisplay();
            setSystemLog('[System] : تم إيداع ' + num.toLocaleString('en-US') + ' د.ع في المحفظة بنجاح.');
        }

        function withdrawMoney() {
            const amount = prompt("أدخل مبلغ السحب من المحفظة:", "50000");
            if (amount === null) return;

            const num = parseAmount(amount);
            if (Number.isNaN(num) || num <= 0) {
                alert("الرجاء إدخال مبلغ صحيح!");
                return;
            }

            if (num > balance) {
                alert("عذراً، رصيد السحب يتجاوز رصيدك الحالي!");
                return;
            }

            balance -= num;
            updateBalanceDisplay();
            setSystemLog('[System] : تم سحب مبلغ ' + num.toLocaleString('en-US') + ' د.ع من بطاقة السوبر كي بنجاح.');
        }

        function resetSystem() {
            if (!confirm("هل تريد مسح وإعادة تعيين البيانات؟")) return;

            balance = DEFAULT_BALANCE;
            updateBalanceDisplay();
            setSystemLog('[System] : تم إعادة ضبط النظام ومسح البيانات بين الطرفين.');
        }

        // تحديث العرض عند تحميل الصفحة
        updateBalanceDisplay();
    </script>
</body>
</html>
